agent:
  name: customer-analytics-agent

  purpose: |
    Convert unstructured WhatsApp conversations containing updates 
    about one or more projects into accurate, complete, and traceable 
    structured project-progress records suitable for a spreadsheet. 
    The output must capture relevant project status, activities, blockers, 
    dependencies, delays, risks, milestones, and next actions 
    without introducing information not supported by the messages.

target:
  deployment: gpt-5.4-mini

evaluator:
  deployment: gpt-5.4

optimization:
  reflection_deployment: gpt-5.4
  max_metric_calls: 100
  max_workers: 8
  cache_evaluation: true
  candidate_selection_strategy: pareto

evaluation:
  weights:
    correctness: 0.35
    response_format: 0.15
    hallucination: 0.30
    task_completion: 0.20

dataset:
  path: dataset.json

prompt:
  path: prompt.txt